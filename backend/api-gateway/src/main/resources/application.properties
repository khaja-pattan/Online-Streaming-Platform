server.port=2001
spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Gateway Route Definitions
spring.cloud.gateway.routes[0].id=user-service-auth
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-service-users
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[2].id=movie-catalog-service
spring.cloud.gateway.routes[2].uri=lb://MOVIE-CATALOG-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/movies/**

spring.cloud.gateway.routes[3].id=watchlist-service
spring.cloud.gateway.routes[3].uri=lb://WATCHLIST-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/watchlist/**

spring.cloud.gateway.routes[4].id=recommendation-service
spring.cloud.gateway.routes[4].uri=lb://RECOMMENDATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/recommendations/**

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


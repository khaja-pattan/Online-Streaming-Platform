server.port=2002
spring.application.name=movie-catalog-service

# Supabase PostgreSQL Database Configuration (Session Pooler)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.ermxmicincezjacgfdhy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Coco100.com}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Tuning (Supabase Free Tier Pool Size = 15 limit)
# Allocates max 3 connections so user, catalog, and watchlist combined stay under 15
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=CatalogHikariPool

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
